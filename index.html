<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siamese Cat Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Siamese Cat Adventure</h1>

        <!-- Game Canvas -->
        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <!-- HUD - Upper Right Corner -->
        <div class="hud">
            <h3>Game Info</h3>
            <div id="coins">Coins: 0 / 7</div>
            <div class="controls">
                <p><strong>W</strong> - Jump (Double Jump)</p>
                <p><strong>A</strong> - Move Left</p>
                <p><strong>D</strong> - Move Right</p>
                <p>Collect 7 coins to win!</p>
            </div>
        </div>
    </div>

    <!-- Narrative Dialog Box -->
    <div id="dialogBox">
        <p id="dialogText"></p>
        <div id="options"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
